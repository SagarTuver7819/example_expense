<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Ocean Infotech">
  <defs>
    <!-- Vibrant Blue-Purple Gradient for ERP Theme -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow -->
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4361ee" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <!-- Main circle with vibrant gradient -->
    <circle cx="90" cy="76" r="52" fill="url(#g)" filter="url(#glow)"/>
    <!-- Wave shape -->
    <path d="M42 104c22 24 74 28 100 0" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <!-- Second wave -->
    <path d="M76 128c-10 6-20 12-26 20" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <!-- Decorative sparkle -->
    <circle cx="118" cy="52" r="10" fill="#ffd60a" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Small decorative dots -->
    <circle cx="45" cy="70" r="5" fill="#06d6a0" opacity="0.8"/>
    <circle cx="135" cy="90" r="4" fill="#ff6b6b" opacity="0.8"/>
  </g>
</svg>
